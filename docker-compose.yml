services:
  postgres:
    image: postgres:16-alpine
    container_name: wai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: wai
      POSTGRES_PASSWORD: wai
      POSTGRES_DB: wai
    volumes:
      - wai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wai -d wai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wai_pg_data:
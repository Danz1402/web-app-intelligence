<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Discovery Lab — Form</title>
  </head>
  <body>
    <h1>Form</h1>
    <p>full document · native form</p>
    <a href="/">Home</a>

    <p id="form-alert" role="alert" hidden>Name is required</p>
    <p id="form-success" hidden>Signup complete</p>

    <form id="signup" name="signup" action="#" method="post">
      <p>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required minlength="2" />
      </p>
      <p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
      </p>
      <p>
        <label for="code">Lab code</label>
        <input id="code" name="code" type="text" pattern="LAB-[0-9]{3}" placeholder="LAB-001" />
      </p>
      <p>
        <label for="qty">Quantity</label>
        <input id="qty" name="qty" type="number" min="1" max="10" value="1" />
      </p>
      <p>
        <label for="plan">Plan</label>
        <select id="plan" name="plan">
          <option value="">Choose</option>
          <option value="free">Free</option>
          <option value="pro">Pro</option>
        </select>
      </p>
      <fieldset>
        <legend>Color</legend>
        <label><input type="radio" name="color" value="red" /> Red</label>
        <label><input type="radio" name="color" value="blue" /> Blue</label>
      </fieldset>
      <p>
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes"></textarea>
      </p>
      <p>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />
      </p>
      <button type="submit">Sign up</button>
      <button type="button" id="show-invalid">Show invalid</button>
    </form>

    <script src="/form.js"></script>
  </body>
</html>
